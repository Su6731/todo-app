<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
    <title>社团成员管理</title>
    <style>
        *{box-sizing: border-box;}
        body{font-family: sans-serif;max-width:480px;margin:24px auto;padding:0 16px;}
        ul{list-style:none;padding-left:0}
        li{padding:8px 0;border-bottom:1px solid #eee}
        .meta{color:#666;font-size:13px;margin-left:8px}
        .btn{margin-left:8px;cursor:pointer}
        .tip{color:#c00;font-size:14px;min-height:20px;}
        form,.search{display:flex;gap:8px;margin-bottom:8px}
        form input,.search input{flex:1;padding:6px}
    </style>
</head>
<body>
    <h1>社团成员管理</h1>
    <form id="add-form">
        <input type="text" id="name-input" placeholder="姓名">
        <input type="text" id="grade-input" placeholder="年级">
        <input type="text" id="dept-input" placeholder="部门">
        <button type="submit" id="submit-btn">添加</button>
    </form>
    <p class="tip" id="tip"></p>
    <div class="search">
        <input type="text" id="search-input" placeholder="按姓名搜索成员">
    </div>
    <ul id="member-list"></ul>
    <script src="shetuan.js"></script>
</body>
</html>
